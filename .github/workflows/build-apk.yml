name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web App & Sync Capacitor
        run: |
          cd client
          npm run build
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x client/android/gradlew

      - name: Build Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryOfTheLeader-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
