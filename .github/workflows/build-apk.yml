name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Verify Node Version
        run: |
          node -v
          npm -v
          which node

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Client Dependencies
        working-directory: ./client
        run: |
          npm install

      - name: Build Web App & Sync Capacitor
        working-directory: ./client
        run: |
          node -v
          npm run build
          npx cap sync android

      - name: Accept Android Licenses & Build Debug APK
        working-directory: ./client/android
        run: |
          chmod +x ./gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryOfTheLeader-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
